# CI for Café Feedback (Lab 5, #25, R-05 and R-06).
# Runs on every Pull Request into staging or main, by hand, and from deploy.yml
# (workflow_call) so a release deploys only after the same checks pass.
# The job id `test-and-docker` is the required status check of the main ruleset:
# do not rename it.
name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throw-away database for this run only. These values are not secrets: the
    # container is reachable only from this job and is deleted when it ends.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cafe_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Automated tests: the database name must end in _test (server/tests/setup).
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/cafe_feedback_test
      # Development database used by the seed and the end-to-end tests.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cafe_feedback
      # Demo password for this run only; never used anywhere else.
      SEED_PASSWORD: ci-demo-password-${{ github.run_id }}
      NODE_ENV: development

    steps:
      # Actions are pinned to full commit SHAs (version in the comment), as in the
      # Lab 5 Starter Kit; Dependabot proposes updates.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Deployment scripts, offline (no GCP access)
        run: |
          bash -n deploy/deploy.sh deploy/release.sh deploy/teardown.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Create the development database, migrate and seed it
        run: |
          psql "postgresql://ci:ci@localhost:5432/postgres" -c "CREATE DATABASE cafe_feedback"
          npm run db:migrate
          npm run db:seed

      - name: Unit, API and database tests (server) and UI component tests (client)
        run: npm test

      - name: Build server and client
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Production Docker image builds
        run: docker build -t cafe-feedback:ci-${{ github.sha }} .
